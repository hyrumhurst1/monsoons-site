## Netlify config for the public site.
## Deploy this folder only. The internal ops app is a separate deploy.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Added only after the certificate was confirmed good: apex serves 200 over
    # HTTPS with ssl_verify=0, http 301s to https, and www redirects to apex.
    # HSTS on a broken certificate locks visitors out of the site for a year,
    # which is why this line was held back until then.
    # Deliberately no `preload`: that is effectively irreversible, and this is a
    # young domain that may still need to move.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

## Caching. The rule that matters: a long max-age is only safe when the filename
## changes whenever the bytes do. There is no build step here, so nothing is
## content-hashed, and the filenames are permanent.
##
## /assets/* was previously cached for 7 days as a block. Because site.css and the
## JS modules keep their names across every edit, a returning visitor kept the old
## stylesheet for up to a week — a deployed change was simply invisible to them.
## Caught it live: the site was serving the new HTML and the previous CSS together.

## Media is genuinely immutable. A different video or photo arrives under a
## different filename, so this can be cached hard.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

## Fonts are immutable in the same way: a new cut would be a new file.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

## Code changes under a stable name, so it must revalidate. Netlify serves ETags,
## which makes the check a 304 with no body — cheap, and always correct.
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

## Logos and social images: edited occasionally under the same name. A day is long
## enough to help repeat visits and short enough that a fix lands the next day.
[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

## HTML must never be cached hard, or a visitor keeps a stale page that references
## assets which no longer exist.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

## Friendly URLs. Keeps links short on business cards and in texts.
[[redirects]]
  from = "/audit"
  to = "/audit.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/work"
  to = "/work.html"
  status = 200

## Unmatched paths serve the real 404 page. This previously pointed at
## /index.html with a 404 status, which meant 404.html was built and styled but
## never actually shown, and a mistyped URL returned the home page under an
## error code — confusing for a visitor and for a crawler.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
