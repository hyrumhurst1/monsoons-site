## Netlify config for the public site.
## Deploy this folder only. The internal ops app is a separate deploy.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

## Video is the heaviest asset and never changes once published.
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

## Friendly URLs. Keeps links short on business cards and in texts.
[[redirects]]
  from = "/audit"
  to = "/audit.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/work"
  to = "/work.html"
  status = 200

## Unmatched paths serve the real 404 page. This previously pointed at
## /index.html with a 404 status, which meant 404.html was built and styled but
## never actually shown, and a mistyped URL returned the home page under an
## error code — confusing for a visitor and for a crawler.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
